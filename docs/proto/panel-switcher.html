<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>能力面板切换 · 三方案原型</title>
<style>
/* ==== 设计令牌（取自 src/plite-tokens.css 静谧蓝白主题） ==== */
:root {
  --bg: #ffffff;
  --bg-hover: #f3f5f9;
  --bg-elevated: #ffffff;
  --bg-translucent: rgba(255, 255, 255, 0.92);
  --bg-code: #f6f8fb;
  --border: rgba(15, 23, 42, 0.075);
  --border-strong: rgba(29, 78, 216, 0.3);
  --text: #101828;
  --text-dim: #5d6473;
  --text-faint: #858ca0;
  --accent: #1d4ed8;
  --accent-bright: #3d6cf0;
  --accent-soft: rgba(29, 78, 216, 0.07);
  --mask-bg: rgba(15, 23, 42, 0.3);
  --radius: 10px;
  --plite-shadow-1: 0 16px 40px rgba(15, 23, 42, 0.07);
  --plite-shadow-2: 0 6px 20px rgba(15, 23, 42, 0.05);
  --plite-dur: 180ms;
  --plite-dur-slow: 360ms;
  --plite-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --fs-md: 13px;
  --font: Inter, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: #e9edf3 radial-gradient(ellipse 60% 50% at 50% 0%, rgba(29, 78, 216, 0.04), transparent 70%);
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }

/* ==== 页面说明 + 模式切换 ==== */
.page-head { text-align: center; padding: 20px 16px 4px; }
.page-head h1 { font-size: 16px; font-weight: 650; letter-spacing: 0.02em; }
.mode-note { font-size: 12px; color: var(--text-dim); max-width: 420px; margin: 6px auto 0; line-height: 1.6; min-height: 38px; }
.mode-switch {
  display: flex; gap: 4px; padding: 4px;
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: 999px; box-shadow: var(--plite-shadow-1);
  margin: 10px 0 18px;
}
.mode-switch button {
  border: none; background: transparent; color: var(--text-dim);
  font-size: 12px; padding: 7px 14px; border-radius: 999px; white-space: nowrap;
  transition: all var(--plite-dur) var(--plite-ease);
}
.mode-switch button.on { background: var(--accent); color: #fff; font-weight: 600; }

/* ==== 手机框（390×844） ==== */
.phone {
  position: relative; width: 390px; height: 844px; flex: none;
  background: var(--bg); border-radius: 28px; overflow: hidden;
  border: 1px solid rgba(15, 23, 42, 0.12);
  box-shadow: 0 30px 80px rgba(15, 23, 42, 0.18);
  margin-bottom: 40px;
}

/* 背后的会话流占位（营造「抽屉盖在聊天上」的真实语境） */
.chat-mock { position: absolute; inset: 0; padding: 18px 14px; background: var(--bg); }
.chat-mock .cm-side { position: absolute; left: 0; top: 0; bottom: 0; width: 44px; background: var(--bg-code); border-right: 1px solid var(--border); }
.chat-mock .cm-bub { height: 44px; border-radius: 12px; background: var(--bg-code); margin: 14px 0 0 56px; }
.chat-mock .cm-bub.me { margin: 14px 10px 0 auto; width: 62%; background: var(--accent-soft); }
.chat-mock .cm-bub:nth-child(odd) { width: 74%; }

/* 抽屉遮罩 + 抽屉本体（对齐 styles.css 移动端形态：宽 min(86vw,340px)） */
.mask { position: absolute; inset: 0; background: var(--mask-bg); backdrop-filter: blur(5px); z-index: 5; transition: opacity var(--plite-dur-slow) var(--plite-ease); }
.drawer {
  position: absolute; top: 0; bottom: 0; right: 0; width: min(86vw, 340px); z-index: 6;
  background: var(--bg); border-left: 1px solid var(--border);
  box-shadow: -18px 0 60px rgba(15, 23, 42, 0.18);
  display: flex; flex-direction: column;
  transition: transform var(--plite-dur-slow) var(--plite-ease);
}
.drawer.closed { transform: translateX(103%); }
.mask.closed { opacity: 0; pointer-events: none; }
.reopen {
  position: absolute; right: 12px; bottom: 18px; z-index: 7;
  border: 1px solid var(--border-strong); background: var(--bg-elevated); color: var(--accent);
  font-size: 12px; padding: 9px 14px; border-radius: 999px; box-shadow: var(--plite-shadow-1);
}

/* ============================================================
   头部方案共用：单行 48px（A/B），现状为双行 96px
   ============================================================ */
.ch-bar {
  position: relative; flex: none; height: 48px; z-index: 3;
  display: flex; align-items: stretch;
  background: var(--bg-translucent);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border);
}
.ch-bar .divider { flex: none; width: 1px; background: var(--border); margin: 8px 0; }
.icon-btn {
  flex: none; width: 42px; border: none; background: transparent; color: var(--text-dim);
  display: inline-flex; align-items: center; justify-content: center;
  transition: color var(--plite-dur) var(--plite-ease);
}
.icon-btn:active { color: var(--accent-bright); }
.icon-btn svg { width: 18px; height: 18px; }

/* ---- A 方案：置顶优先实体 tab + ＋n 收纳 ---- */
.tabstrip { flex: 1 1 auto; min-width: 0; display: flex; align-items: stretch; overflow: hidden; padding-left: 4px; }
.tab {
  position: relative; flex: none; border: none; background: transparent;
  padding: 0 10px; color: var(--text-dim); font-size: var(--fs-md); white-space: nowrap;
  transition: color var(--plite-dur) var(--plite-ease);
}
.tab::after {
  content: ''; position: absolute; left: 8px; right: 8px; bottom: 0; height: 2px;
  background: var(--accent); border-radius: 2px 2px 0 0;
  transform: scaleX(0); transition: transform var(--plite-dur-slow) var(--plite-ease);
}
.tab.active { color: var(--accent-bright); font-weight: 600; }
.tab.active::after { transform: scaleX(1); }
.tab .pin-dot {
  position: absolute; left: 3px; top: 9px; width: 3px; height: 3px; border-radius: 50%;
  background: var(--accent); opacity: 0.75;
}
.more-btn {
  flex: none; display: inline-flex; align-items: center; gap: 3px;
  border: none; background: transparent; color: var(--text-dim);
  font-size: 12px; padding: 0 8px;
  transition: color var(--plite-dur) var(--plite-ease);
}
.more-btn svg { width: 12px; height: 12px; }
.more-btn:hover, .more-btn[aria-expanded='true'] { color: var(--accent-bright); }

/* ---- B 方案：修复版 sheet 选择器（与现状同构，视觉修正） ---- */
.sheet-trigger {
  flex: 1 1 auto; min-width: 0; margin: 6px 0 6px 10px;
  display: flex; align-items: center; height: 36px; padding: 0 12px;
  border: 1px solid var(--border); border-radius: 9px; background: var(--bg);
  color: var(--text); font-size: 13px; transition: border-color var(--plite-dur) var(--plite-ease);
}
.sheet-trigger[aria-expanded='true'] { border-color: var(--accent); color: var(--accent-bright); }
.sheet-trigger .cnt { margin-left: 6px; font-size: 11px; color: var(--text-faint); }
.sheet-trigger .chev { margin-left: auto; width: 15px; height: 15px; color: var(--text-faint); transition: transform var(--plite-dur) var(--plite-ease); }
.sheet-trigger[aria-expanded='true'] .chev { transform: rotate(180deg); }

/* ---- 抽屉头（三案共用，对齐实机 WorkspaceTree shell-drawer-head：标题保留） ---- */
.drawer-head {
  flex: none; height: 44px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 6px 0 14px; background: var(--bg-translucent); border-bottom: 1px solid var(--border);
}
.drawer-head .t { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; }
/* ---- 现状复刻：左挤下拉 + 文本 ⟳（刻意还原问题） ---- */
.cur-bar { flex: none; height: 52px; display: flex; align-items: stretch; position: relative; background: var(--bg-translucent); border-bottom: 1px solid var(--border); }
.cur-pill {
  flex: 1 1 auto; min-width: 0; margin-left: 12px; height: 36px;
  display: flex; align-items: center; gap: 8px; padding: 0 12px;
  border: 1px solid var(--border); border-radius: 9px; background: var(--bg);
  color: var(--text); font-size: 13px;
}
.cur-pill svg { width: 16px; height: 16px; color: var(--text-faint); }
.cur-refresh { flex: none; width: 46px; border: none; border-left: 1px solid var(--border); background: transparent; color: var(--text-dim); font-size: 15px; }

/* ==== 全宽下拉菜单（A/B 共用；对齐现有 sc-menu 窄屏形态） ==== */
.menu {
  position: absolute; top: 100%; left: 0; right: 0; z-index: 20;
  max-height: 62vh; overflow-y: auto; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: 2px; padding: 8px;
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 18px 44px rgba(15, 23, 42, 0.14);
  animation: menu-in var(--plite-dur) var(--plite-ease);
}
@keyframes menu-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.menu-search { height: 40px; font-size: 14px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); outline: none; margin-bottom: 4px; font-family: inherit; }
.menu-search:focus-visible { border-color: var(--accent); }
.menu-row { display: flex; align-items: center; border-radius: 8px; }
.menu-row.active { background: var(--accent-soft); }
.menu-item {
  flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px;
  padding: 13px 10px; border: none; background: transparent; color: var(--text);
  font-size: 14px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.menu-item .idx { font-size: 11px; color: var(--text-faint); width: 20px; flex: none; }
.menu-row.active .menu-item { color: var(--accent-bright); font-weight: 600; }
.menu-pin { flex: none; width: 40px; height: 40px; margin-right: 2px; border: none; border-radius: 8px; background: transparent; color: var(--text-faint); display: inline-flex; align-items: center; justify-content: center; }
.menu-pin svg { width: 16px; height: 16px; }
.menu-pin.pinned { color: var(--accent-bright); }
.menu-empty { padding: 12px; text-align: center; font-size: 12px; color: var(--text-faint); }

/* ==== 面板内容占位 ==== */
.pane { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px 14px 90px; }
.pane h2 { font-size: 16px; font-weight: 650; margin-bottom: 4px; }
.pane .sub { font-size: 12px; color: var(--text-faint); margin-bottom: 14px; }
.skel { height: 58px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-code); margin-bottom: 10px; position: relative; }
.skel::after { content: ''; position: absolute; left: 12px; top: 18px; width: 44%; height: 8px; border-radius: 4px; background: rgba(15, 23, 42, 0.06); }
.skel.w2::after { width: 30%; top: 32px; }

/* 手机端真机预览：铺满视口 */
@media (max-width: 520px) {
  body { display: block; background: var(--bg); }
  .page-head, .mode-switch { position: fixed; z-index: 99; }
  .page-head { top: 0; left: 0; right: 0; background: var(--bg-translucent); backdrop-filter: blur(12px); padding: 8px 12px 6px; }
  .page-head h1 { font-size: 13px; }
  .mode-note { display: none; }
  .mode-switch { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); margin: 0; }
  .phone { width: 100vw; height: calc(100dvh - 42px); margin-top: 42px; border: none; border-radius: 0; margin-bottom: 0; box-shadow: none; }
  .reopen { bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
}
</style>
</head>
<body>
  <header class="page-head">
    <h1>能力面板切换 · 三方案原型（390×844）</h1>
    <p class="mode-note" id="modeNote"></p>
  </header>

  <nav class="mode-switch" id="modeSwitch">
    <button data-mode="cur">现状 WIP</button>
    <button data-mode="b">B · 修复 sheet</button>
    <button data-mode="a" class="on">A · tab＋下拉 ★推荐</button>
  </nav>

  <div class="phone">
    <div class="chat-mock">
      <div class="cm-side"></div>
      <div class="cm-bub"></div>
      <div class="cm-bub me"></div>
      <div class="cm-bub"></div>
      <div class="cm-bub me"></div>
      <div class="cm-bub"></div>
    </div>
    <div class="mask" id="mask"></div>
    <aside class="drawer" id="drawer">
      <div id="chrome"></div>
      <div class="pane" id="pane"></div>
    </aside>
    <button class="reopen" id="reopen" hidden>‹ 打开能力面板</button>
  </div>

<script>
'use strict';
/* ==== 数据：与实机一致的 20 个 panel 槽插件（order 对齐 manifest） ==== */
var PANELS = [
  { id: 'cap',      t: '能力',     o: 1 },
  { id: 'model',    t: '模型',     o: 2 },
  { id: 'bash',     t: 'Bash',    o: 3 },
  { id: 'account',  t: '账号',     o: 4 },
  { id: 'preview',  t: '预览',     o: 5 },
  { id: 'files',    t: '文件',     o: 6 },
  { id: 'ledger',   t: '记账',     o: 7 },
  { id: 'forensic', t: '取证',     o: 8 },
  { id: 'tempcred', t: '临时凭证',  o: 9 },
  { id: 'browser',  t: '浏览器',   o: 10 },
  { id: 'phone',    t: '手机',     o: 11 },
  { id: 'plugins',  t: '插件',     o: 12 },
  { id: 'endpoint', t: '端点',     o: 13 },
  { id: 'mode',     t: '模式',     o: 14 },
  { id: 'fileedit', t: '文件编辑',  o: 20 },
  { id: 'mcp',      t: 'MCP',     o: 21 },
  { id: 'skill',    t: '技能',     o: 22 },
  { id: 'hook',     t: '钩子',     o: 23 },
  { id: 'market',   t: '商城',     o: 24 },
  { id: 'share',    t: '分享',     o: 25 }
];
var state = {
  mode: 'a',                 // 'cur' | 'b' | 'a'
  active: 'model',
  pins: ['model', 'bash', 'preview'],   // 模拟已有置顶
  menuOpen: false,
  query: '',
  drawerOpen: true,
  hidden: []                 // A 方案中未进实体 tab 的面板
};

/* ==== 工具 ==== */
function $(id) { return document.getElementById(id); }
function byOrder(a, b) { return a.o - b.o; }
function ordered() {
  var pin = PANELS.filter(function (p) { return state.pins.indexOf(p.id) >= 0; }).sort(byOrder);
  var rest = PANELS.filter(function (p) { return state.pins.indexOf(p.id) < 0; }).sort(byOrder);
  return pin.concat(rest);
}
function activePanel() {
  return PANELS.filter(function (p) { return p.id === state.active; })[0] || PANELS[1];
}
var CHEV = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var REFRESH = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var CLOSE = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
var STAR = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';

/* ==== 模式说明 ==== */
var NOTES = {
  cur: '现状（未提交 WIP）：标题行 + 切换条共 96px；下拉箭头挤在文字旁、按钮顶对齐、文本字形 ⟳ —— 即截图里的问题形态。',
  b: '方案 B：保留「能力面板」标题行；sheet 选择器修视觉——箭头贴右缘、面板计数徽章、SVG 图标、垂直居中。代价：切换仍需 2 步，其余面板平时不可见。',
  a: '方案 A（推荐）：保留「能力面板」标题行；切换条上置顶面板以实体 tab 一步直达，放不下的收进「＋n」菜单——菜单贴着顶栏下方展开（无需滚动），可搜索/可置顶，无横向滚动。'
};

/* ==== 渲染：头部 chrome（标题行保留 + 各案切换条；菜单锚定在切换条内、贴其下缘展开） ==== */
function renderChrome() {
  var c = $('chrome');
  var head = '<div class="drawer-head"><span class="t">能力面板</span><button class="icon-btn" data-act="close" style="width:44px;height:44px">' + CLOSE + '</button></div>';
  if (state.mode === 'cur') {
    c.innerHTML = head +
      '<div class="cur-bar">' +
        '<button class="cur-pill" data-act="menu">' +
          '<span>' + activePanel().t + '</span>' + CHEV +
        '</button>' +
        '<button class="cur-refresh" data-act="refresh" aria-label="刷新当前面板">⟳</button>' +
        (state.menuOpen ? menuHtml() : '') +
      '</div>';
  } else if (state.mode === 'b') {
    c.innerHTML = head +
      '<div class="ch-bar">' +
        '<button class="sheet-trigger" data-act="menu" aria-haspopup="menu" aria-expanded="' + state.menuOpen + '">' +
          '<span>' + activePanel().t + '</span>' +
          '<span class="cnt">共 ' + PANELS.length + ' 个面板</span>' +
          '<svg class="chev" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '</button>' +
        '<span class="divider"></span>' +
        '<button class="icon-btn" data-act="refresh" aria-label="刷新当前面板">' + REFRESH + '</button>' +
        (state.menuOpen ? menuHtml() : '') +
      '</div>';
  } else {
    c.innerHTML = head +
      '<div class="ch-bar">' +
        '<div class="tabstrip" id="tabstrip"></div>' +
        '<button class="more-btn" id="moreBtn" data-act="menu" aria-haspopup="menu" aria-expanded="' + state.menuOpen + '">' +
          '<span id="moreCnt"></span>' + CHEV +
        '</button>' +
        '<span class="divider"></span>' +
        '<button class="icon-btn" data-act="refresh" aria-label="刷新当前面板">' + REFRESH + '</button>' +
        (state.menuOpen ? menuHtml() : '') +
      '</div>';
    fitTabs();
  }
}

/* A 方案：tab 视空间自适应——置顶优先入列，放不下即止，其余进 ＋n */
function fitTabs() {
  var strip = $('tabstrip');
  if (!strip) return;
  var all = ordered();
  var vis = all.filter(function (p) { return state.pins.indexOf(p.id) >= 0; });
  var rest = all.filter(function (p) { return state.pins.indexOf(p.id) < 0; });
  function paint() {
    strip.innerHTML = vis.map(function (p) {
      return '<button class="tab' + (p.id === state.active ? ' active' : '') + '" data-tab="' + p.id + '">' +
        (state.pins.indexOf(p.id) >= 0 ? '<i class="pin-dot"></i>' : '') + p.t + '</button>';
    }).join('');
  }
  paint();
  function over() { return strip.scrollWidth > strip.clientWidth + 1; }
  // 置顶太多也放不下时，从尾部收敛（至少保留 1 个）
  while (vis.length > 1 && over()) { vis.pop(); paint(); }
  // 依序试探补位：放得下才收
  for (var i = 0; i < rest.length; i++) {
    vis.push(rest[i]); paint();
    if (over()) { vis.pop(); paint(); break; }
  }
  var visIds = vis.map(function (p) { return p.id; });
  state.hidden = all.filter(function (p) { return visIds.indexOf(p.id) < 0; });
  var more = $('moreCnt');
  if (more) more.textContent = state.hidden.length > 0 ? '＋' + state.hidden.length : '';
  var moreBtn = $('moreBtn');
  if (moreBtn) moreBtn.style.display = state.hidden.length > 0 ? '' : 'none';
}

/* ==== 渲染：全宽菜单（贴切换条下缘展开；可搜索 / 置顶 / 当前高亮） ==== */
function rowHtml(p, i) {
  var pinned = state.pins.indexOf(p.id) >= 0;
  return '<div class="menu-row' + (p.id === state.active ? ' active' : '') + '">' +
    '<button class="menu-item" data-pick="' + p.id + '">' +
      '<span class="idx">' + (i + 1) + '</span>' + p.t +
      (pinned ? '<span style="font-size:10px;color:var(--accent);margin-left:2px">置顶</span>' : '') +
    '</button>' +
    '<button class="menu-pin' + (pinned ? ' pinned' : '') + '" data-pin="' + p.id + '" aria-label="' + (pinned ? '取消置顶' : '置顶') + p.t + '">' + STAR + '</button>' +
  '</div>';
}
function filteredPanels() {
  var q = state.query.trim().toLowerCase();
  return ordered().filter(function (p) { return !q || p.t.toLowerCase().indexOf(q) >= 0; });
}
function menuHtml() {
  var rows = filteredPanels().map(rowHtml).join('');
  return '<div class="menu" id="menu">' +
    (PANELS.length > 8 ? '<input class="menu-search" id="menuSearch" type="search" placeholder="搜索面板" value="' + state.query + '" />' : '') +
    '<div id="menuRows">' + (rows || '<div class="menu-empty">无匹配面板</div>') + '</div>' +
  '</div>';
}

/* ==== 渲染：面板内容占位 ==== */
function renderPane() {
  var p = activePanel();
  $('pane').innerHTML =
    '<h2>' + p.t + '</h2>' +
    '<div class="sub">' + p.t + ' 面板内容占位 · 点上方 tab / 菜单切换验证手感</div>' +
    '<div class="skel"></div><div class="skel"></div><div class="skel w2"></div><div class="skel w2"></div>';
}

/* ==== 事件 ==== */
document.addEventListener('click', function (e) {
  var t = e.target;
  var act = t.closest && t.closest('[data-act]');
  if (act) {
    var a = act.getAttribute('data-act');
    if (a === 'menu') { state.menuOpen = !state.menuOpen; if (!state.menuOpen) state.query = ''; renderChrome(); return; }
    if (a === 'refresh') {
      act.style.transition = 'transform 400ms var(--plite-ease)';
      act.style.transform = 'rotate(360deg)';
      setTimeout(function () { act.style.transition = 'none'; act.style.transform = 'none'; }, 420);
      renderPane();
      return;
    }
    if (a === 'close') { closeDrawer(); return; }
  }
  var tab = t.closest && t.closest('[data-tab]');
  if (tab) { state.active = tab.getAttribute('data-tab'); state.menuOpen = false; renderChrome(); renderPane(); return; }
  var pick = t.closest && t.closest('[data-pick]');
  if (pick) { state.active = pick.getAttribute('data-pick'); state.menuOpen = false; state.query = ''; renderChrome(); renderPane(); return; }
  var pin = t.closest && t.closest('[data-pin]');
  if (pin) {
    var id = pin.getAttribute('data-pin');
    var i = state.pins.indexOf(id);
    if (i >= 0) state.pins.splice(i, 1); else state.pins.push(id);
    renderChrome();
    return;
  }
  // 菜单外点击关闭
  if (state.menuOpen && !(t.closest && t.closest('#menu')) && !(t.closest && t.closest('[data-act="menu"]'))) {
    state.menuOpen = false; state.query = ''; renderChrome();
  }
});
document.addEventListener('input', function (e) {
  if (e.target && e.target.id === 'menuSearch') {
    state.query = e.target.value;
    var rowsEl = document.getElementById('menuRows');
    if (rowsEl) {
      var rows = filteredPanels().map(rowHtml).join('');
      rowsEl.innerHTML = rows || '<div class="menu-empty">无匹配面板</div>';
    }
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && state.menuOpen) { state.menuOpen = false; state.query = ''; renderChrome(); }
});
function closeDrawer() {
  state.drawerOpen = false; state.menuOpen = false;
  $('drawer').classList.add('closed');
  $('mask').classList.add('closed');
  $('reopen').hidden = false;
}
function openDrawer() {
  state.drawerOpen = true;
  $('drawer').classList.remove('closed');
  $('mask').classList.remove('closed');
  $('reopen').hidden = true;
}
$('reopen').addEventListener('click', openDrawer);
$('mask').addEventListener('click', closeDrawer);

/* 模式切换 */
$('modeSwitch').addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('button[data-mode]');
  if (!b) return;
  state.mode = b.getAttribute('data-mode');
  state.menuOpen = false; state.query = '';
  Array.prototype.forEach.call($('modeSwitch').children, function (x) { x.classList.toggle('on', x === b); });
  $('modeNote').textContent = NOTES[state.mode];
  renderChrome(); renderPane();
});
window.addEventListener('resize', function () { if (state.mode === 'a') fitTabs(); });

/* 启动 */
$('modeNote').textContent = NOTES[state.mode];
renderChrome();
renderPane();
</script>
</body>
</html>
