<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>S3 v3：面板导航（对齐 Polaris ToolSwitcher）</title>
<style>
  :root {
    --bg-base: rgb(0 0 0); --bg-elevated: rgb(26 26 31); --bg-surface: rgb(37 37 43);
    --bg-hover: rgb(45 45 53); --border-subtle: rgba(255 255 255 / 0.08); --border: rgba(255 255 255 / 0.12);
    --text-primary: rgb(248 248 248); --text-secondary: rgb(180 180 184); --text-tertiary: rgb(142 142 147);
    --primary: rgb(59 130 246); --primary-soft: rgba(59 130 246 / 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg-base); color: var(--text-primary); font-family: 'Segoe UI', 'PingFang SC', system-ui, sans-serif; }
  .app { display: grid; grid-template-columns: 48px 300px 1fr 300px; height: 100vh; overflow: hidden; }

  /* 活动栏（对齐 Polaris ActivityBar） */
  .activity { background: var(--bg-elevated); border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 4px; }
  .activity .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #fff; margin-bottom: 8px; }
  .activity button { width: 36px; height: 36px; border: none; background: transparent; color: var(--text-tertiary); border-radius: 8px; cursor: pointer; font-size: 16px; }
  .activity button:hover { background: var(--bg-hover); color: var(--text-primary); }
  .activity button.active { color: var(--text-primary); }
  .activity button.active::before { content: ''; display: block; width: 2px; height: 20px; background: var(--primary); margin: -24px 0 8px -10px; border-radius: 2px; }

  /* 面板导航主体（ToolSwitcher 风格常驻栏） */
  .pnav { background: var(--bg-elevated); border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; min-height: 0; }
  .pnav-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0; }
  .pnav-head .ic { width: 24px; height: 24px; border-radius: 8px; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .pnav-head .tt { flex: 1; font-size: 13px; font-weight: 500; }
  .pnav-head .chip { border: 1px solid var(--border-subtle); border-radius: 999px; padding: 1px 8px; font-size: 11px; color: var(--text-tertiary); }
  .pnav-search { padding: 8px 12px; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0; }
  .pnav-search .box { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border: 1px solid var(--border-subtle); border-radius: 8px; background: var(--bg-surface); color: var(--text-tertiary); }
  .pnav-search input { flex: 1; border: none; outline: none; background: transparent; color: var(--text-primary); font-size: 13px; }
  .pnav-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; }
  .pnav-sec { font-size: 11px; color: var(--text-tertiary); margin: 8px 4px 6px; }
  .pnav-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 8px; }
  .pnav-tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: none; background: transparent; color: var(--text-secondary); border-radius: 8px; padding: 6px 2px; cursor: pointer; }
  .pnav-tile:hover { background: var(--bg-hover); color: var(--text-primary); }
  .pnav-tile.active { background: var(--primary-soft); color: var(--primary); }
  .pnav-tile .ico { font-size: 17px; }
  .pnav-tile .lbl { font-size: 10.5px; }
  .pnav-cat { display: flex; align-items: center; gap: 6px; padding: 6px 8px; color: var(--text-tertiary); font-size: 12px; }
  .pnav-cat .cnt { margin-left: auto; }
  .pnav-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: none; border-radius: 8px; background: transparent; color: var(--text-secondary); font-size: 12.5px; cursor: pointer; text-align: left; min-height: 32px; }
  .pnav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
  .pnav-item.active { background: var(--primary-soft); color: var(--primary); }
  .pnav-item .ico { width: 18px; text-align: center; }
  .pnav-item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pnav-item .star { border: none; background: transparent; color: var(--text-tertiary); cursor: pointer; font-size: 12px; padding: 0 2px; }
  .pnav-item .star:hover { color: var(--primary); }
  .pnav-foot { border-top: 1px solid var(--border-subtle); padding: 6px 12px; display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-tertiary); flex-shrink: 0; }
  .pnav-foot .sp { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pnav-foot button { border: none; background: transparent; color: var(--text-secondary); font-size: 11px; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
  .pnav-foot button:hover { background: var(--bg-hover); color: var(--text-primary); }

  .sess { border-top: 1px solid var(--border-subtle); padding: 8px 10px; max-height: 150px; overflow-y: auto; flex-shrink: 0; }
  .sess-new { width: 100%; padding: 7px; border: 1px dashed var(--border); border-radius: 8px; background: transparent; color: var(--text-tertiary); cursor: pointer; font-size: 12px; }
  .sess-item { padding: 6px; font-size: 12px; color: var(--text-tertiary); border-radius: 8px; }
  .sess-item.active { background: var(--primary-soft); color: var(--text-primary); }

  .main { display: flex; flex-direction: column; min-width: 0; background: var(--bg-base); }
  .stream { flex: 1; overflow-y: auto; padding: 24px; }
  .bubble { max-width: 70%; padding: 10px 14px; border-radius: 12px; background: var(--bg-elevated); margin-bottom: 12px; font-size: 13.5px; line-height: 1.65; }
  .bubble.me { margin-left: auto; background: var(--primary-soft); }
  .input { border-top: 1px solid var(--border-subtle); padding: 12px 16px; }
  .input textarea { width: 100%; min-height: 64px; background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 10px; font: inherit; resize: vertical; outline: none; }
  .rpanel { background: var(--bg-elevated); border-left: 1px solid var(--border-subtle); padding: 16px; font-size: 12.5px; color: var(--text-tertiary); overflow-y: auto; }
</style>
</head>
<body>
<div class="app">
  <nav class="activity">
    <div class="logo">P</div>
    <button title="对话">💬</button>
    <button title="面板" class="active">🧩</button>
    <button title="设置">⚙️</button>
  </nav>
  <aside class="pnav">
    <div class="pnav-head">
      <div class="ic">▦</div>
      <div class="tt">面板导航</div>
      <div class="chip" id="cnt">13</div>
    </div>
    <div class="pnav-search">
      <div class="box">🔎 <input id="q" placeholder="搜索面板…" /></div>
    </div>
    <div class="pnav-scroll">
      <div class="pnav-sec">置顶</div>
      <div class="pnav-grid" id="pinGrid"></div>
      <div id="groupList"></div>
    </div>
    <div class="pnav-foot">
      <span>当前面板</span><span class="sp" id="footActive">—</span><button id="footLogout">登出</button>
    </div>
    <div class="sess">
      <button class="sess-new">+ 新会话</button>
      <div class="sess-item active">会话：演示会话 1</div>
      <div class="sess-item">会话：供应商联调</div>
    </div>
  </aside>
  <main class="main">
    <div class="stream" id="stream"></div>
    <div class="input"><textarea placeholder="输入消息…" rows="2"></textarea></div>
  </main>
  <aside class="rpanel">
    <strong>面板区</strong>
    <p>当前激活面板：<span id="activeName">—</span></p>
    <p>此区域演示右侧能力面板（cap-panel / model-admin）。</p>
  </aside>
</div>
<script>
  const PANELS = [
    { id: 'chat', name: '会话面板', icon: '💬', group: 'chat', order: 1 },
    { id: 'history', name: '历史会话', icon: '🕘', group: 'chat', order: 2 },
    { id: 'git', name: 'Git 面板', icon: '🌿', group: 'dev', order: 1 },
    { id: 'terminal', name: '终端', icon: '⌨️', group: 'dev', order: 2 },
    { id: 'model-admin', name: '模型供应商', icon: '🧠', group: 'dev', order: 3 },
    { id: 'csv', name: 'CSV 检查', icon: '📄', group: 'data', order: 1 },
    { id: 'json', name: 'JSON 检查', icon: '🧾', group: 'data', order: 2 },
    { id: 'log', name: '日志透视', icon: '📜', group: 'data', order: 3 },
    { id: 'api', name: '接口压测', icon: '🚀', group: 'tools', order: 1 },
    { id: 'docker', name: '容器工作台', icon: '🐳', group: 'tools', order: 2 },
    { id: 'k8s', name: 'K8s 体检', icon: '☸️', group: 'tools', order: 3 },
    { id: 'misc-a', name: '未分组面板 A', icon: '📦', group: 'misc', order: 1 },
    { id: 'misc-b', name: '未分组面板 B', icon: '📦', group: 'misc', order: 2 },
  ];
  const GROUP_LABEL = { chat: '对话', dev: '开发', data: '数据', tools: '工具', misc: '更多插件' };
  const GROUP_ORDER = ['chat', 'dev', 'data', 'tools', 'misc'];
  const PREF_KEY = 'polaris.sidebar.prefs.v3';

  const prefs = Object.assign({ pins: ['chat', 'api'], collapsedGroups: ['data', 'tools', 'misc'], active: 'chat', query: '' }, loadPrefs());
  function loadPrefs() { try { return JSON.parse(localStorage.getItem(PREF_KEY) || '{}'); } catch { return {}; } }
  function savePrefs() { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); }

  function render() { renderPinned(); renderGroups(); renderStream(); savePrefs(); }

  function renderPinned() {
    const row = document.getElementById('pinGrid');
    const pinned = prefs.pins.map((id) => PANELS.find((p) => p.id === id)).filter(Boolean);
    row.innerHTML = '';
    pinned.forEach((p) => {
      const b = document.createElement('button');
      b.className = 'pnav-tile' + (prefs.active === p.id ? ' active' : '');
      b.innerHTML = '<span class="ico">' + p.icon + '</span><span class="lbl">' + p.name + '</span>';
      b.title = p.name + '（右键取消置顶）';
      b.onclick = () => { prefs.active = p.id; render(); };
      b.oncontextmenu = (e) => { e.preventDefault(); unpin(p.id); };
      row.appendChild(b);
    });
  }

  function unpin(id) {
    prefs.pins = prefs.pins.filter((x) => x !== id);
    render();
  }

  function renderGroups() {
    const root = document.getElementById('groupList');
    root.innerHTML = '';
    const q = (prefs.query || '').toLowerCase();
    const byGroup = {};
    PANELS.forEach((p) => {
      if (prefs.pins.includes(p.id)) return;
      const hay = (p.name + ' ' + p.id).toLowerCase();
      if (q && !hay.includes(q)) return;
      (byGroup[p.group] ??= []).push(p);
    });
    GROUP_ORDER.forEach((gid) => {
      const items = (byGroup[gid] ?? []).sort((a, b) => (a.order - b.order) || a.name.localeCompare(b.name));
      if (gid !== 'misc' && items.length === 0) return;
      const collapsed = prefs.collapsedGroups.includes(gid);
      const sec = document.createElement('section');
      sec.className = 'pnav-group' + (collapsed ? ' closed' : '');
      sec.dataset.group = gid;
      const head = document.createElement('button');
      head.className = 'pnav-cat';
      head.innerHTML = '<span class="caret">▾</span> ' + GROUP_LABEL[gid] + ' <span class="cnt">' + items.length + '</span>';
      head.onclick = () => {
        prefs.collapsedGroups = collapsed ? prefs.collapsedGroups.filter((x) => x !== gid) : prefs.collapsedGroups.concat(gid);
        render();
      };
      sec.appendChild(head);
      const body = document.createElement('div');
      body.className = 'pnav-items';
      items.forEach((p) => {
        const row = document.createElement('button');
        row.className = 'pnav-item' + (prefs.active === p.id ? ' active' : '');
        row.innerHTML = '<span class="ico">' + p.icon + '</span><span class="nm">' + p.name + '</span>';
        const pin = document.createElement('span');
        pin.className = 'star';
        pin.textContent = '☆';
        pin.title = '置顶';
        pin.onclick = (e) => {
          e.stopPropagation();
          if (prefs.pins.length >= 8) { alert('置顶已满（8），请先取消一个'); return; }
          prefs.pins = prefs.pins.concat(p.id);
          render();
        };
        row.appendChild(pin);
        row.onclick = () => { prefs.active = p.id; render(); };
        body.appendChild(row);
      });
      sec.appendChild(body);
      root.appendChild(sec);
    });
  }

  function renderStream() {
    const p = PANELS.find((x) => x.id === prefs.active) ?? PANELS[0];
    document.getElementById('activeName').textContent = p.name;
    document.getElementById('footActive').textContent = p.name;
    document.getElementById('stream').innerHTML =
      '<div class="bubble me">打开「' + p.name + '」</div>' +
      '<div class="bubble">这里是「' + p.name + '」面板内容区（v3 原型）。搜索 + 置顶 + 分组折叠提供高信息密度导航。</div>';
  }

  document.getElementById('q').addEventListener('input', (e) => { prefs.query = e.target.value; render(); });

  render();
</script>
</body>
</html>
